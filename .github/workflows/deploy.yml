name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NDIGO_REPO: ${{ github.workspace }}/ndigo
      CREATE_NDIGO_APP_REPO: ${{ github.workspace }}/create-ndigo-app
      NDIGO_SKILLS_REPO: ${{ github.workspace }}/ndigo-skills
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # The framework repo is private, so the default GITHUB_TOKEN cannot read
      # it. Provide a PAT with read access via the NDIGO_REPO_TOKEN secret.
      - name: Checkout framework (source of truth for docs + registry)
        uses: actions/checkout@v4
        with:
          repository: ndigo/ndigo
          path: ndigo
          token: ${{ secrets.NDIGO_REPO_TOKEN }}

      # The standalone repositories are public, so the default token can read
      # them. The sync scripts take their paths from the env block above.
      - name: Checkout scaffolder (source for the Scaffolding page)
        uses: actions/checkout@v4
        with:
          repository: ndigo/create-ndigo-app
          path: create-ndigo-app

      - name: Checkout skills (source for the Agent Skills page)
        uses: actions/checkout@v4
        with:
          repository: ndigo/ndigo-skills
          path: ndigo-skills

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install site dependencies
        run: npm ci

      - name: Install framework dependencies
        run: cd ndigo && pnpm install --frozen-lockfile

      - name: Build framework
        run: cd ndigo && pnpm build

      - name: Generate API docs
        run: cd ndigo && pnpm doc:api

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ndigo-site
